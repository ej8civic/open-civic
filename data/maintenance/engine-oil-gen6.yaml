# Engine oil service, Gen 6 US Civic (1996-2000)
# Source: honda-sm-civic-96-00, section 8, pages 8-6 to 8-8.

source: { id: honda-sm-civic-96-00, pages: "8-6..8-8" }

oil:
  api_grade: "SJ 'Energy Conserving' (or SH 'Energy Conserving II'), or API CERTIFICATION mark"
  viscosity_preferred: 5W-30
  viscosity_alternative: "10W-30 (only if your climate stays inside its temperature range)"

interval:
  normal:  { miles: 7500, km: 12000, months: 12 }
  severe:  { miles: 3750, km: 6000,  months: 6 }
  filter:  "normal: every other oil change; severe: every oil change"

filter:
  type: Must have a built-in bypass valve
  install: Oil the rubber seal, hand-tight until seated, then 7/8 turn
  torque_nm: 22
  torque_lbf_ft: 16
  honda_tool: "07912-6110001 (oil filter wrench)"

drain_bolt:
  washer: Replace every time
  torque:
    - { engines: [D16Y5, D16Y8], nm: 39, lbf_ft: 29 }
    - { engines: [D16Y7, B16A2], nm: 44, lbf_ft: 33 }

after_service: Run the engine for more than 3 minutes, then check for leaks.
