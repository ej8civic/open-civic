name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false          # docs and data never need LFS objects
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "docs/**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path docs/examples "docs/**/*.md" README.md
          fail: true
