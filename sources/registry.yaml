# Open Civic: source registry
#
# Every fact in docs/ and data/ must cite an `id` from this file.
# CI rejects citations to sources whose status is not `approved`.
#
# trust:   A = official Honda / government
#          B = open-source project with published files
#          C = community reference site
#          D = forum / social; used only as a lead to investigate, never as a spec
# policy:  redistribute = file may be committed to sources/public (LFS)
#          cite-only    = facts restated in our words + page citation; file stays in sources/private
#          link-only    = link to it; do not copy text, images or files (license unknown/none)
#          lead-only    = never cited as proof (trust D)

sources:

  # ── Official ────────────────────────────────────────────────────────────
  - id: honda-sm-civic-96-00
    title: Honda Civic 1996-2000 Service Manual
    publisher: Honda Motor Co., Ltd.
    date: 1998-08
    url: https://archive.org/details/HondaCivic19962000
    type: official
    trust: A
    license: "© Honda Motor Co. (all rights reserved)"
    policy: cite-only
    local: sources/private/honda-sm-civic-1996-2000.pdf
    covers: { generations: [gen6], chassis: [EK, EJ, EM1], years: [1996, 2000], markets: [US] }
    status: approved
    approved_by: ej8civic
    approved_on: 2026-11-11

  - id: honda-sm-civic-92-95
    title: Honda Civic 1992-1995 Service Manual
    publisher: Honda Motor Co., Ltd.
