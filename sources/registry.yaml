    trust: A
    license: "© Honda Motor Co."
    policy: cite-only
    covers: { generations: [gen5], chassis: [EG, EH, EJ1] }
    status: approved
    approved_by: ej8civic
    approved_on: 2026-11-11
    notes: Not yet obtained.

  - id: honda-sm-civic-01-05
